<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f2">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>名古屋亚运 · 羽毛球观赛之旅</title>
  <link rel="stylesheet" href="styles.css?v=20260910-3">
  <link rel="stylesheet" href="ledger.css?v=20260910-2">
  <link rel="stylesheet" href="sections.css?v=20260914-1">
  <script src="runtime-storage.js?v=20260910-2" defer></script>
  <script src="sync.js?v=20260914-1" defer></script>
  <script src="overview-map.js?v=20260910-2" defer></script>
  <script src="route-ui.js?v=20260910-2" defer></script>
  <script src="app.js?v=20260910-4" defer></script>
  <script src="ticket-pdf-preview.js?v=20260910-2" defer></script>
  <script src="ledger.js?v=20260910-3" defer></script>
  <script src="sections.js?v=20260914-1" defer></script>
  <script src="live.js?v=20260914-1" defer></script>
  <script src="site-navigation.js?v=20260910-2" defer></script>
</head>
<body>
  <a class="skip-link" id="skip-link" href="#main">跳到主要内容</a>
  <header class="topbar" id="topbar">
    <a class="wordmark" id="wordmark" href="#top" aria-label="返回顶部"></a>
    <nav class="primary-navigation" aria-label="主要模块">
      <details class="travel-navigation" id="travel-navigation" hidden>
        <summary id="travel-navigation-trigger">旅行信息</summary>
        <div class="travel-navigation-menu" role="menu" aria-label="旅行信息栏目">
          <a href="#flights" role="menuitem" data-module="flights" hidden>航班</a>
          <a href="#schedule" role="menuitem">赛程</a>
          <a href="#stay" role="menuitem">住宿</a>
          <a href="#weather" role="menuitem">天气</a>
          <a href="#fx" role="menuitem">汇率</a>
          <a href="#prep" role="menuitem" data-module="todo" hidden>准备</a>
        </div>
      </details>
      <a class="primary-navigation__ledger" id="ledger-navigation-link" href="#ledger" data-module="ledger" hidden>记账</a>
    </nav>
  </header>

  <main id="main" data-site-view="travel">
    <section class="hero" id="top" aria-labelledby="trip-title">
      <div class="hero__eyebrow" id="trip-eyebrow"></div>
      <h1 id="trip-title">正在载入旅程</h1>
      <p class="hero__date" id="trip-date"></p>
    </section>

    <section class="section flights-section" id="flights" aria-labelledby="flights-title" data-module="flights" hidden>
      <div class="section-heading">
        <div>
          <p class="section-kicker">BOARDING</p>
          <h2 id="flights-title">航班信息</h2>
        </div>
        <p class="section-index" id="flight-index" aria-live="polite">1 / 3</p>
      </div>
      <div class="flight-carousel" id="flight-carousel" aria-label="航班卡片，可左右滑动"></div>
      <div class="carousel-dots" id="flight-dots" aria-hidden="true"></div>
    </section>

    <section class="section schedule-section" id="schedule" aria-labelledby="schedule-title">
      <div class="section-heading">
        <div>
          <p class="section-kicker">MATCH SCHEDULE</p>
          <h2 id="schedule-title">赛程</h2>
        </div>
        <span class="soft-label" id="schedule-range"></span>
      </div>
      <p class="notice" id="schedule-countdown"></p>
      <div id="schedule-body"></div>
    </section>

    <section class="section stay-section" id="stay" aria-labelledby="stay-title">
      <div class="section-heading">
        <div>
          <p class="section-kicker">WHERE WE STAY</p>
          <h2 id="stay-title">住宿</h2>
        </div>
        <span class="soft-label">AIRBNB</span>
      </div>
      <div id="stay-body"></div>
    </section>

    <section class="section weather-section" id="weather" aria-labelledby="weather-title">
      <div class="section-heading">
        <div>
          <p class="section-kicker">FORECAST</p>
          <h2 id="weather-title">天气预报</h2>
        </div>
        <span class="soft-label" id="weather-range"></span>
      </div>
      <div id="weather-body"></div>
    </section>

    <section class="section fx-section" id="fx" aria-labelledby="fx-title">
      <div class="section-heading">
        <div>
          <p class="section-kicker">EXCHANGE RATE</p>
          <h2 id="fx-title">日元汇率</h2>
        </div>
        <span class="soft-label">T-1</span>
      </div>
      <div id="fx-body"></div>
    </section>

    <section class="section prep-section" id="prep" aria-labelledby="prep-title" data-module="todo" hidden>
      <div class="section-heading">
        <div>
          <p class="section-kicker">BEFORE WE GO</p>
          <h2 id="prep-title">旅行前准备</h2>
        </div>
        <span class="soft-label" id="todo-progress">0 / 0</span>
      </div>
      <form class="todo-form" id="todo-form">
        <input id="todo-input" type="text" maxlength="80" placeholder="添加一项准备事项" aria-label="准备事项">
        <button type="submit">添加</button>
      </form>
      <div class="todo-list" id="todo-list"></div>
    </section>

    <span id="route-day-count" hidden></span>

    <footer class="footer">
      <p id="footer-mark"></p>
      <a href="#top">回到顶部 ↑</a>
    </footer>
  </main>

  <main class="ledger-view" id="ledger-view" data-site-view="ledger" data-module="ledger" hidden>
    <div id="ledger-root"></div>
  </main>

  <dialog class="ticket-dialog" id="ticket-dialog" aria-labelledby="ticket-dialog-title">
    <header>
      <div>
        <span>门票与预订</span>
        <h2 id="ticket-dialog-title">门票详情</h2>
      </div>
      <button type="button" id="ticket-dialog-close" aria-label="关闭门票详情">关闭</button>
    </header>
    <div class="ticket-dialog__body" id="ticket-dialog-body"></div>
  </dialog>

  <div class="loading-error" id="loading-error" hidden>
    <strong>行程暂时无法载入</strong>
    <span>请确认 trip-data.json 已通过生成校验，并与网页位于同一目录。</span>
  </div>
</body>
</html>
